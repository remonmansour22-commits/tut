name: Build Roblox place file

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "default.project.json"
      - ".github/workflows/rojo-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "default.project.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rojo-rbx/setup-rojo@v1
        with:
          version: "7.4.4"

      - name: Build place file
        run: rojo build default.project.json -o build/Beastbound_TheGreatMigration.rbxlx

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beastbound_TheGreatMigration
          path: build/Beastbound_TheGreatMigration.rbxlx
